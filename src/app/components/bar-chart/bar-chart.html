<div class="bar-chart-container">
  <div class="chart-toolbar">
    <div class="metric-switcher">
      @for (m of metrics; track m.key) {
        <button
          class="metric-btn"
          [class.active]="state.barMetric() === m.key"
          (click)="state.barMetric.set(m.key)">
          {{ m.label }}
        </button>
      }
    </div>
    <label class="toggle-label" title="Only the Pareto set on run cost and intelligence, as in the table">
      <input type="checkbox" [checked]="state.showOnlyPareto()" (change)="state.showOnlyPareto.update(v => !v)"/>
      Pareto only
    </label>
    @if (hasEffortBars()) {
      <label class="toggle-label" title="Show the effort levels of one model side by side, ranked by the best level">
        <input type="checkbox" [checked]="state.barGroupByModel()" (change)="state.barGroupByModel.update(v => !v)"/>
        Group by model
      </label>
    }
    <div class="legend">
      @for (item of legendItems(); track item.label) {
        <span class="legend-item">
          <span class="dot" [style.background]="item.color"></span>{{ item.label }}
        </span>
      }
    </div>
  </div>
  <app-missing-data-hint [models]="chartData().missing"/>
  <div class="canvas-wrap">
    <canvas #canvas></canvas>
  </div>
</div>
